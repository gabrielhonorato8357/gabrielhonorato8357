<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(270 105) rotate(45) scale(410 260)">
      <stop stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1135 310) rotate(20) scale(370 240)">
      <stop stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="180" y1="70" x2="1180" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:800;letter-spacing:-1px;fill:#F8FAFC}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:600;fill:#CBD5E1}
      .mono{font-family:JetBrains Mono,Consolas,monospace;font-weight:600;fill:#7DD3FC}
      .chip{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:700;fill:#E2E8F0}
      .line{stroke:url(#stroke);stroke-width:3;stroke-linecap:round;opacity:.85}
      .grid{stroke:#334155;stroke-width:1;opacity:.18}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
      @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-260}}
      @keyframes scan{0%{transform:translateX(-260px);opacity:0}20%{opacity:.65}80%{opacity:.65}100%{transform:translateX(1460px);opacity:0}}
      .floatA{animation:floatA 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .floatB{animation:floatB 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .dash{stroke-dasharray:14 18;animation:dash 9s linear infinite}
      .scan{animation:scan 6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glow1)"/>
  <rect width="1400" height="420" rx="28" fill="url(#glow2)"/>
  <g>
    <path class="grid" d="M0 70H1400M0 140H1400M0 210H1400M0 280H1400M0 350H1400"/>
    <path class="grid" d="M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420M1200 0V420M1300 0V420"/>
  </g>
  <rect class="scan" x="0" y="0" width="140" height="420" fill="#38BDF8" opacity=".12"/>
  <g class="floatA" opacity=".92">
    <rect x="86" y="72" width="168" height="88" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".45"/>
    <text x="112" y="109" class="mono" font-size="20">React</text>
    <text x="112" y="137" class="mono" font-size="18" fill="#CBD5E1">Next.js</text>
  </g>
  <g class="floatB" opacity=".9">
    <rect x="1125" y="72" width="190" height="92" rx="18" fill="#0F172A" stroke="#A855F7" stroke-opacity=".45"/>
    <text x="1152" y="110" class="mono" font-size="20">C# / .NET</text>
    <text x="1152" y="139" class="mono" font-size="18" fill="#CBD5E1">Secondary Stack</text>
  </g>
  <g class="floatB" opacity=".88">
    <rect x="1050" y="265" width="210" height="82" rx="18" fill="#0F172A" stroke="#22C55E" stroke-opacity=".45"/>
    <text x="1078" y="303" class="mono" font-size="20">Node.js</text>
    <text x="1078" y="330" class="mono" font-size="18" fill="#CBD5E1">Python / FastAPI</text>
  </g>
  <g class="floatA" opacity=".86">
    <rect x="145" y="270" width="188" height="82" rx="18" fill="#0F172A" stroke="#22C55E" stroke-opacity=".45"/>
    <text x="172" y="307" class="mono" font-size="20">SaaS</text>
    <text x="172" y="334" class="mono" font-size="18" fill="#CBD5E1">AI Products</text>
  </g>
  <path class="line dash" d="M254 116C412 48 492 123 614 180C758 247 922 182 1125 116"/>
  <path class="line dash" d="M333 311C505 380 667 312 792 260C913 210 983 250 1050 306" opacity=".72"/>
  <circle class="pulse" cx="614" cy="180" r="7" fill="#38BDF8"/>
  <circle class="pulse" cx="792" cy="260" r="7" fill="#22C55E"/>
  <circle class="pulse" cx="1125" cy="116" r="7" fill="#A855F7"/>
  <text x="700" y="155" text-anchor="middle" class="title" font-size="54">Gabriel Honorato</text>
  <text x="700" y="205" text-anchor="middle" class="sub" font-size="27">Senior Full Stack Engineer · SaaS · AI · Cloud</text>
  <text x="700" y="252" text-anchor="middle" class="mono" font-size="22">React • Next.js • Node.js • Python • C#/.NET</text>
  <g opacity=".95">
    <rect x="437" y="294" width="144" height="42" rx="21" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".4"/>
    <text x="509" y="322" text-anchor="middle" class="chip">Frontend</text>
    <rect x="601" y="294" width="144" height="42" rx="21" fill="#0F172A" stroke="#22C55E" stroke-opacity=".4"/>
    <text x="673" y="322" text-anchor="middle" class="chip">Backend</text>
    <rect x="765" y="294" width="96" height="42" rx="21" fill="#0F172A" stroke="#A855F7" stroke-opacity=".4"/>
    <text x="813" y="322" text-anchor="middle" class="chip">AI</text>
    <rect x="881" y="294" width="96" height="42" rx="21" fill="#0F172A" stroke="#38BDF8" stroke-opacity=".4"/>
    <text x="929" y="322" text-anchor="middle" class="chip">Cloud</text>
  </g>
</svg>
